version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: ingestion_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root123
      POSTGRES_DB: ingestion_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: ingestion_app
    depends_on:
      - postgres
    ports:
      - "8000:8000"
    env_file:
      - .env.docker

volumes:
  postgres_data: